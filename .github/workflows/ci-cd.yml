
name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t cicd-demo:${{ github.sha }} .

  publish-image:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest

    needs: test-and-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Normalize image name
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
  
  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest

    needs: publish-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_URL="${IMAGE_NAME}:sha-${GITHUB_SHA}"

          echo "Requesting deployment of the commit-specific image."

          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Render accepted the deployment request."

      - name: Verify application health endpoint
        env:
          APP_URL: ${{ vars.RENDER_SERVICE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$APP_URL" ]; then
            echo "RENDER_SERVICE_URL is not configured."
            exit 1
          fi

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              --max-time 10 \
              "${APP_URL%/}/health"; then
              echo
              echo "Health endpoint responded successfully."
              exit 0
            fi

            echo "Health check attempt $attempt failed; retrying in 15 seconds."
            sleep 15
          done

          echo "Application health check failed."
          exit 1